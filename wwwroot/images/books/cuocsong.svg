<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7C59F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Book cover background -->
  <rect width="200" height="280" fill="url(#bg1)" rx="4"/>
  <!-- Spine shadow -->
  <rect width="8" height="280" fill="#00000022" rx="2"/>
  <!-- Decorative circle -->
  <circle cx="100" cy="105" r="55" fill="#ffffff22"/>
  <circle cx="100" cy="105" r="40" fill="#ffffff33"/>
  <!-- Sun/life symbol -->
  <circle cx="100" cy="105" r="25" fill="#FFD700" opacity="0.9"/>
  <line x1="100" y1="68" x2="100" y2="58" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="142" x2="100" y2="152" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  <line x1="63" y1="105" x2="53" y2="105" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  <line x1="137" y1="105" x2="147" y2="105" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  <line x1="75" y1="80" x2="68" y2="73" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  <line x1="125" y1="130" x2="132" y2="137" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  <line x1="125" y1="80" x2="132" y2="73" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  <line x1="75" y1="130" x2="68" y2="137" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  <!-- Divider line -->
  <rect x="20" y="170" width="160" height="2" fill="#ffffff66" rx="1"/>
  <!-- Title -->
  <text x="100" y="192" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Cuộc Sống Rất</text>
  <text x="100" y="208" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Giống Cuộc Đời</text>
  <!-- Author -->
  <text x="100" y="235" font-family="Arial" font-size="9" fill="#ffffffcc" text-anchor="middle">Hải Dờ</text>
  <!-- Bottom bar -->
  <rect x="0" y="258" width="200" height="22" fill="#00000033" rx="0"/>
  <text x="100" y="273" font-family="Arial" font-size="8" fill="#ffffffaa" text-anchor="middle">NXB Cuộc Sống</text>
</svg>
